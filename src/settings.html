<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 — 盯盘小助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f4f5f7;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 20px 24px 0;
    }
    .header h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .header .hint {
      font-size: 12px;
      color: #8a92a0;
      margin-top: -8px;
      margin-bottom: 14px;
    }

    /* Add stock form */
    .add-row {
      display: flex;
      gap: 8px;
      padding: 0 24px 16px;
    }
    .add-row select, .add-row input {
      padding: 8px 12px;
      border: 1px solid #d0d3d8;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .add-row input {
      flex: 1;
    }
    .add-row input:focus { border-color: #4a90d9; }
    .add-row button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      background: #2c3e50;
      color: #fff;
      transition: background 0.15s;
    }
    .add-row button:hover { background: #1a2a3a; }

    /* Stock list */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 24px;
    }
    .list {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e8eaed;
      overflow: hidden;
    }
    .list-item {
      display: grid;
      grid-template-columns: 28px 1fr 65px 65px 62px 66px auto;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #f0f2f4;
      transition: background 0.1s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: #f8f9fb; }

    .toggle {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #2c3e50;
    }
    .stock-name {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stock-code {
      font-size: 12px;
      color: #8a92a0;
      font-variant-numeric: tabular-nums;
    }
    .stock-price {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .stock-change {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .stock-pct {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-weight: 500;
    }
    .up { color: #e63946; }
    .down { color: #2a9d8f; }
    .flat { color: #888; }

    .btn-del {
      padding: 4px 10px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      background: #fee;
      color: #e74c3c;
      transition: background 0.15s;
    }
    .btn-del:hover { background: #fdd; }

    .list-empty {
      padding: 32px 20px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }
    .group-label {
      padding: 10px 16px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #8a92a0;
      letter-spacing: 0.5px;
      background: #fafbfc;
      border-bottom: 1px solid #f0f2f4;
    }

    /* Footer */
    .footer {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #e8eaed;
    }
    .status {
      font-size: 13px;
      color: #27ae60;
    }
    .btn-close {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      background: #e8eaed;
      color: #555;
      transition: background 0.15s;
    }
    .btn-close:hover { background: #d0d3d8; }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚙ 盯盘设置</h2>
    <p class="hint">勾选左侧复选框控制是否在悬浮窗显示（指数与个股均可）</p>
  </div>

  <div class="add-row">
    <select id="market">
      <option value="sh">沪 SH</option>
      <option value="sz">深 SZ</option>
    </select>
    <input id="stock-code" type="text" placeholder="股票代码，如 600519" maxlength="6" />
    <button id="btn-add-stock">+ 添加</button>
  </div>

  <div class="list-container">
    <div class="list" id="watchlist">
      <div class="list-empty">暂无自选股</div>
    </div>
  </div>

  <div class="footer">
    <span id="status" class="status"></span>
    <button class="btn-close" id="btn-close">关闭</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
